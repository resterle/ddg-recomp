; Densha de GO! FINAL (recompiled) - handheld defaults (640x480 screen, 1 GB RAM)
; texformat 1 = 32-bit textures (filtered by the GPU), 0 = 8-bit paletted (less memory, but the
; palette lookup in the shader is far too slow for the Mali-G31)
texformat = 1
texsize = 1
scrwidth = 640
scrheight = 480
aspect = auto
drawdistance = 0.40
fullscreen = 1
crop = 1
launcher = 0
; skip drawing up to this many frames in a row when the device falls behind, so the game keeps
; full speed (0 = draw every frame; the game then runs in slow motion when the device is too slow)
frameskip = 3
; draw at most this many frames per second (60 divided by a whole number: 30, 20, 15; 0 = 60). The
; game logic keeps 60 Hz. On the R36H, maxfps = 30 holds 30 with drawdistance = 0.90
maxfps = 0
; GL renderer speed-ups (see README.txt): batch model draws, skip blending/alpha tests that
; cannot change a pixel (slightly harder edges on cut-out textures), mipmaps for opaque textures
batching = 1
fastalpha = 1
mipmaps = 1
; 1 = wait for the display refresh (no tearing); 0 = don't wait (may tear, but the game loses no
; time waiting while the device is too slow for 60 frames/s)
vsync = 1
; 1 = draw on a separate CPU core while the game computes the next frame, and present (wait for the
; display) on a third thread (faster); 0 = old behaviour
threaded = 1
; 1 = textures as layers of texture arrays: fewer draw calls, but the Mali-G31 samples them slower
texarrays = 0
; 1 = opaque textures in 16-bit colour: faster texture loading at scenery changes, slight banding
tex16 = 0
; 1 = show frames drawn per second in the top-left corner
fps = 0
