# Builds the shareable programs (RECOMP_JIT: no game code; the program translates the player's
# perfect.exe and compiles it on the first start) for Linux x86-64 and macOS (Apple Silicon), and
# publishes them as a GitHub release for a version tag (v*). Started by hand (Actions tab), it only
# builds: the packages are the run's artifacts.
#
# Only these programs may be published: the other builds (docker-build.sh, the builder kit, the
# handheld package) contain code translated from perfect.exe.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-22.04                 # glibc 2.35, as the desktop builds
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools (LLVM 23 from apt.llvm.org, SDL3 build dependencies)
        run: sh recomp/linux/release-deps.sh
      - uses: actions/cache@v4
        with:
          path: recomp/build/release-cache
          key: release-linux-x64-${{ hashFiles('recomp/linux/build-release.sh') }}
      - name: Build
        run: sh recomp/linux/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ddg-recomp-linux-x64
          path: recomp/build/ddg-recomp-linux-x64.tar.xz
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools (Homebrew LLVM and lld)
        run: brew install llvm lld cmake ninja zstd
      - uses: actions/cache@v4
        with:
          path: recomp/build/release-cache-macos
          key: release-macos-arm64-${{ hashFiles('recomp/macos/build-release.sh') }}
      - name: Build
        run: sh recomp/macos/build-release.sh
        env:
          DDG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ddg-recomp-macos-arm64
          path: recomp/build/ddg-recomp-macos-arm64.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [linux-x64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "ddg-recomp $GITHUB_REF_NAME" --notes "$(cat <<'EOF'
          Densha de GO! FINAL (PC), recompiled. These programs contain no part of the game: they need
          your own copy (the cddata folder and an unprotected perfect.exe). On the first start the
          program translates perfect.exe and compiles it for your computer (one to two minutes).

          - Linux x86-64 (glibc 2.35 or newer): unpack ddg-recomp-linux-x64.tar.xz, run ddg-recomp/perfect_recomp.
          - macOS (Apple Silicon, macOS 14 or newer): unpack the zip; the app is not notarised, so open it
            the first time with right-click > Open.

          The game code made on your computer is kept in ~/.cache/ddg-recomp (macOS ~/Library/Caches/ddg-recomp):
          do not share it. Licences and the source commit are inside each package (GPL-3.0).
          EOF
          )"
